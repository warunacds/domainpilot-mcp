# Fly config for the remote MCP endpoint (mcp.domainpilot.io).
# Stateless: every request builds its own server + client from the bearer
# token, so auto-stop/auto-start costs nothing but a cold-start.
app = 'domainpilot-mcp'
primary_region = 'ams'

[env]
  PORT = '3000'
  OAUTH_ISSUER = 'https://api.domainpilot.io'
  MCP_RESOURCE_URL = 'https://mcp.domainpilot.io/mcp'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
